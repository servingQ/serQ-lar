[package]
name = "serq-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "serQ compiled to WebAssembly for serq-lar"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serq = { git = "https://github.com/servingQ/serQ", tag = "v0.1.6-alpha.10" }
wasm-bindgen = "0.2"
serde_json = "1"
# serQ seeds its streams itself (SeedableRng) and never reads the OS, but
# rand's default features pull getrandom in; on the web its backend must be
# named (.cargo/config.toml sets the cfg).
getrandom = { version = "0.3", features = ["wasm_js"] }
